<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Laya" />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="apple-touch-icon" href="logo.png" />
  <title>Laya-语音匹配</title>
  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 18px);
      --safe-bottom: env(safe-area-inset-bottom, 14px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      touch-action: manipulation;
    }

    .app-container {
      position: relative;
      width: 100%;
      height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding-top: calc(var(--safe-top) + 12px);
      padding-bottom: calc(var(--safe-bottom) + 8px);
      background: #000000;
    }

    /* 顶部栏：居中 Logo+Laya+语音匹配 + 右上角悬浮窗小图标 */
    .top-bar-row {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px 20px;
    }

    .top-header {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 4px 10px;
      border-radius: 20px;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .top-header:active {
      opacity: 0.7;
    }

    .brand-logo {
      width: 22px;
      height: 22px;
      border-radius: 5px;
      object-fit: cover;
      box-shadow: 0 0 8px rgba(196, 43, 179, 0.45);
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: rgba(255, 255, 255, 0.95);
    }

    .top-right-icon {
      position: absolute;
      right: 22px;
      top: 50%;
      transform: translateY(-50%);
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.85);
      cursor: pointer;
    }

    /* 中上区域：左侧「添加好友/关注」 + 中间圆形头像与昵称 */
    .profile-section {
      position: relative;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 2.5vh;
    }

    .avatar-row {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 左侧 + 添加好友/关注 */
    .add-friend-box {
      position: absolute;
      left: calc(50% - 132px);
      top: 50%;
      transform: translateY(-42%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.15s ease;
    }

    .add-friend-box.hidden {
      display: none;
    }

    .add-friend-box:active {
      transform: translateY(-42%) scale(0.93);
    }

    .add-friend-circle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1.2px solid rgba(255, 255, 255, 0.32);
      background: rgba(255, 255, 255, 0.03);
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.9);
      font-size: 20px;
      font-weight: 400;
      transition: all 0.2s ease;
    }

    .add-friend-box.followed .add-friend-circle {
      border-color: rgba(255, 255, 255, 0.65);
      background: rgba(255, 255, 255, 0.14);
    }

    .add-friend-label {
      font-size: 10.5px;
      color: rgba(255, 255, 255, 0.48);
      letter-spacing: 0.2px;
      white-space: nowrap;
    }

    /* 中间头像 */
    .avatar-wrapper {
      position: relative;
      width: 112px;
      height: 112px;
      border-radius: 50%;
      border: 2.2px solid rgba(255, 255, 255, 0.9);
      overflow: hidden;
      cursor: pointer;
      background: #1a1a1e;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.65);
      transition: transform 0.18s ease;
    }

    .avatar-wrapper:active {
      transform: scale(0.96);
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* 头像正下方加粗白色昵称 */
    .nickname-box {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      min-height: 24px;
    }

    .nickname-text {
      font-size: 15.5px;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: 0.4px;
      text-align: center;
      max-width: 240px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 2px 10px;
      border-radius: 8px;
      transition: background 0.2s;
    }

    .nickname-text:active {
      background: rgba(255, 255, 255, 0.12);
    }

    .nickname-text.hidden {
      display: none;
    }

    /* 中间菱形/梭形高对比白色语音声波条 */
    .waveform-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 82px;
      margin: 1vh 0;
    }

    .waveform-bars {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4.5px;
      height: 58px;
    }

    .wave-bar {
      width: 5px;
      background-color: #ffffff;
      border-radius: 999px;
      height: 8px;
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.25);
      transition: height 0.13s ease-in-out, opacity 0.25s ease;
    }

    .waveform-bars.paused .wave-bar {
      opacity: 0.35;
      box-shadow: none;
    }

    /* 底部计时器 + 挂断控制 + 底部发送文字栏 */
    .bottom-controls-area {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 16px;
      gap: 18px;
    }

    /* 计时器与挂断状态 */
    .timer-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      min-height: 44px;
      cursor: pointer;
    }

    .call-timer {
      font-size: 19px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.8px;
      color: #ffffff;
    }

    .hangup-info {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      animation: fadeIn 0.22s ease;
    }

    .hangup-info.visible {
      display: flex;
    }

    .hangup-status-badge {
      font-size: 13px;
      font-weight: 600;
      color: #ff5b63;
      letter-spacing: 0.3px;
    }

    .hangup-timestamp {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.55);
      font-variant-numeric: tabular-nums;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(3px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 操作按钮行 */
    .action-buttons-row {
      width: 100%;
      max-width: 300px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 52px;
      margin-bottom: 4px;
    }

    .action-buttons-row.single-mode .side-ctrl-btn {
      display: none;
    }

    .ctrl-btn-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      cursor: pointer;
    }

    .ctrl-circle {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, background-color 0.2s ease, opacity 0.2s ease;
    }

    .ctrl-circle:active {
      transform: scale(0.92);
    }

    .ctrl-circle.outline {
      border: 1.8px solid rgba(255, 255, 255, 0.78);
      background: rgba(255, 255, 255, 0.03);
      color: #ffffff;
    }

    .ctrl-circle.outline.active-toggle {
      background: rgba(255, 255, 255, 0.92);
      color: #000000;
      border-color: #ffffff;
    }

    .ctrl-circle.hangup {
      width: 62px;
      height: 62px;
      background: linear-gradient(180deg, #ff543e 0%, #e6353f 100%);
      border: none;
      color: #ffffff;
      box-shadow: 0 4px 18px rgba(235, 58, 66, 0.42);
    }

    .ctrl-circle.hangup.is-ended {
      background: #2c2c30;
      box-shadow: none;
      border: 1.5px solid rgba(255, 255, 255, 0.24);
    }

    .ctrl-label {
      font-size: 11.5px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.72);
      letter-spacing: 0.3px;
    }

    /* 底部多功能输入栏（还原图2：可选左侧 + / 麦克风 + 「发文字...」胶囊框带发送箭头 ▶ + 右侧听筒/扬声器图标） */
    .bottom-dock {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 2px 2px 0;
    }

    .dock-left-icons {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dock-left-icons.hidden {
      display: none;
    }

    .dock-icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.85);
      cursor: pointer;
      flex-shrink: 0;
    }

    .dock-icon-btn:active {
      opacity: 0.7;
    }

    .chat-pill {
      flex: 1;
      height: 38px;
      background: #1d1c23;
      border-radius: 19px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px 0 15px;
    }

    .chat-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: rgba(255, 255, 255, 0.9);
      font-size: 13px;
      user-select: text;
      -webkit-user-select: text;
    }

    .chat-input::placeholder {
      color: rgba(255, 255, 255, 0.38);
    }

    .send-arrow-btn {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.88);
      cursor: pointer;
      flex-shrink: 0;
    }

    .dock-right-speaker {
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.88);
      cursor: pointer;
      flex-shrink: 0;
      position: relative;
    }

    .dock-right-speaker::after {
      content: "";
      position: absolute;
      bottom: 3px;
      width: 12px;
      height: 2px;
      border-radius: 2px;
      background: #34d399;
    }

    /* 隐藏的文件上传控件 */
    #avatarFileInput {
      display: none;
    }

    /* 手机端快捷编辑弹窗 */
    .settings-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
    }

    .settings-backdrop.open {
      display: flex;
    }

    .settings-sheet {
      width: 100%;
      max-width: 480px;
      max-height: 85dvh;
      overflow-y: auto;
      background: #1c1c1e;
      border-radius: 20px 20px 0 0;
      padding: 18px 20px calc(var(--safe-bottom) + 18px);
      color: #ffffff;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      animation: slideUp 0.22s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .sheet-title {
      font-size: 16px;
      font-weight: 600;
    }

    .sheet-close {
      background: rgba(255, 255, 255, 0.12);
      border: none;
      color: #ffffff;
      padding: 5px 12px;
      border-radius: 14px;
      font-size: 13px;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 6px;
    }

    .form-row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .form-input {
      flex: 1;
      min-width: 140px;
      background: #2c2c2e;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 8px 12px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      user-select: text;
      -webkit-user-select: text;
    }

    .form-input:focus {
      border-color: #a855f7;
    }

    .btn-action {
      background: #8b3dff;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 8px 13px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-action.secondary {
      background: #2c2c2e;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .btn-action.active-opt {
      background: #8b3dff;
      border-color: #a855f7;
    }

    .sheet-tip {
      font-size: 11.5px;
      color: rgba(255, 255, 255, 0.42);
      text-align: center;
      margin-top: 8px;
    }
  </style>
</head>

      <div class="sheet-header">
        <span class="sheet-title">Laya 语音匹配 · 手机自定义设置</span>
        <button class="sheet-close" id="closeSettingsBtn">完成</button>
      </div>

      <div class="form-group">
        <label class="form-label">头像与昵称（直接点击页面上的头像和昵称也可快速修改）</label>
        <div class="form-row">
          <button class="btn-action" id="sheetUploadAvatarBtn">上传手机相册头像</button>
          <input type="text" class="form-input" id="nicknameInput" value="他超爱了" placeholder="输入昵称（留空则隐藏）" />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">界面布局样式切换</label>
        <div class="form-row">
          <button class="btn-action secondary active-opt" id="styleSingleBtn">图2新版（单挂断键+加好友）</button>
          <button class="btn-action secondary" id="styleTripleBtn">图1经典版（静音+挂断+免提三键）</button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">细节元素开关</label>
        <div class="form-row">
          <button class="btn-action secondary active-opt" id="toggleAddFriendVisBtn">显示「+ 添加好友/关注」</button>
          <button class="btn-action secondary active-opt" id="toggleDockLeftVisBtn">显示底部左侧「+ / 话筒」</button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">顶部标题文字</label>
        <div class="form-row">
          <input type="text" class="form-input" id="brandTitleInput" value="Laya-语音匹配" placeholder="例如：Laya-语音匹配" />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">通话正计时设置（秒数，例如填 22 即从 00:22 开始正计时）</label>
        <div class="form-row">
          <input type="number" class="form-input" id="customSecondsInput" value="22" min="0" placeholder="起始秒数" />
          <button class="btn-action secondary" id="applyTimerBtn">应用并开始</button>
          <button class="btn-action secondary" id="resetZeroBtn">从 00:00 开始</button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">自定义挂断时间（留空则挂断时自动显示当前系统时间）</label>
        <div class="form-row">
          <input type="text" class="form-input" id="customHangupTimeInput" placeholder="例如：10:50 或 23:18:06" />
        </div>
      </div>

      <div class="sheet-tip">
        提示：点击头像换图 · 点击昵称改名 · 点击顶部「Laya-语音匹配」或右上角图标随时呼出设置
      </div>
    </div>
  </div>

  <script>
    // 默认情侣/氛围感头像
    const DEFAULT_AVATAR = "data:image/svg+xml;utf8," + encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
        <defs>
          <radialGradient id="g" cx="50%" cy="45%" r="55%">
            <stop offset="0%" stop-color="#383842"/>
            <stop offset="100%" stop-color="#0d0d11"/>
          </radialGradient>
        </defs>
        <rect width="240" height="240" fill="url(#g)"/>
        <circle cx="96" cy="94" r="34" fill="#f3edea"/>
        <circle cx="152" cy="102" r="31" fill="#e8dfd9"/>
        <path d="M40 230 C52 162, 128 162, 138 230 Z" fill="#18181f"/>
        <path d="M108 230 C118 170, 186 170, 202 230 Z" fill="#23232d"/>
      </svg>
    `);

    const avatarTrigger = document.getElementById('avatarTrigger');
    const avatarFileInput = document.getElementById('avatarFileInput');
    const avatarImage = document.getElementById('avatarImage');
    const nicknameTrigger = document.getElementById('nicknameTrigger');
    const nicknameDisplay = document.getElementById('nicknameDisplay');
    const brandTitleText = document.getElementById('brandTitleText');
    const addFriendBtn = document.getElementById('addFriendBtn');
    const addFriendIcon = document.getElementById('addFriendIcon');
    const addFriendLabel = document.getElementById('addFriendLabel');

    const waveformBars = document.getElementById('waveformBars');
    const waveBarElements = Array.from(waveformBars.querySelectorAll('.wave-bar'));

    const callTimerEl = document.getElementById('callTimer');
    const hangupInfoEl = document.getElementById('hangupInfo');
    const hangupStatusBadge = document.getElementById('hangupStatusBadge');
    const hangupTimestamp = document.getElementById('hangupTimestamp');

    const actionButtonsRow = document.getElementById('actionButtonsRow');
    const muteBtn = document.getElementById('muteBtn');
    const muteCircle = document.getElementById('muteCircle');
    const muteLabel = document.getElementById('muteLabel');

    const hangupBtn = document.getElementById('hangupBtn');
    const hangupCircle = document.getElementById('hangupCircle');
    const hangupLabel = document.getElementById('hangupLabel');

    const speakerBtn = document.getElementById('speakerBtn');
    const speakerCircle = document.getElementById('speakerCircle');
    const speakerLabel = document.getElementById('speakerLabel');
    const dockLeftIcons = document.getElementById('dockLeftIcons');

    // 设置弹窗元素
    const topHeader = document.getElementById('topHeader');
    const topRightSettingBtn = document.getElementById('topRightSettingBtn');
    const timerTrigger = document.getElementById('timerTrigger');
    const settingsModal = document.getElementById('settingsModal');
    const closeSettingsBtn = document.getElementById('closeSettingsBtn');
    const sheetUploadAvatarBtn = document.getElementById('sheetUploadAvatarBtn');
    const nicknameInput = document.getElementById('nicknameInput');
    const brandTitleInput = document.getElementById('brandTitleInput');
    const customSecondsInput = document.getElementById('customSecondsInput');
    const applyTimerBtn = document.getElementById('applyTimerBtn');
    const resetZeroBtn = document.getElementById('resetZeroBtn');
    const customHangupTimeInput = document.getElementById('customHangupTimeInput');
    const styleSingleBtn = document.getElementById('styleSingleBtn');
    const styleTripleBtn = document.getElementById('styleTripleBtn');
    const toggleAddFriendVisBtn = document.getElementById('toggleAddFriendVisBtn');
    const toggleDockLeftVisBtn = document.getElementById('toggleDockLeftVisBtn');

    let elapsedSeconds = 0;
    let isCallEnded = false;
    let isMuted = false;
    let isSpeakerOn = false;
    let isFollowed = false;
    let timerInterval = null;
    let waveInterval = null;

    function formatDuration(totalSeconds) {
      const sec = Math.max(0, Math.floor(totalSeconds));
      const hours = Math.floor(sec / 3600);
      const minutes = Math.floor((sec % 3600) / 60);
      const seconds = sec % 60;
      const mm = String(minutes).padStart(2, '0');
      const ss = String(seconds).padStart(2, '0');
      if (hours > 0) {
        const hh = String(hours).padStart(2, '0');
        return `${hh}:${mm}:${ss}`;
      }
      return `${mm}:${ss}`;
    }

    function getCurrentTimeStr() {
      const customVal = customHangupTimeInput.value.trim();
      if (customVal) return customVal;
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      const ss = String(now.getSeconds()).padStart(2, '0');
      return `${hh}:${mm}:${ss}`;
    }

    function renderTimer() {
      callTimerEl.textContent = formatDuration(elapsedSeconds);
    }

    function startCallTimer() {
      if (timerInterval) clearInterval(timerInterval);
      isCallEnded = false;
      hangupInfoEl.classList.remove('visible');
      hangupCircle.classList.remove('is-ended');
      hangupLabel.textContent = '挂断';
      waveformBars.classList.toggle('paused', isMuted);
      renderTimer();

      timerInterval = setInterval(() => {
        if (!isCallEnded) {
          elapsedSeconds += 1;
          renderTimer();
        }
      }, 1000);
    }

    function triggerHangup() {
      isCallEnded = true;
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      const durationStr = formatDuration(elapsedSeconds);
      const endTimeStr = getCurrentTimeStr();

      hangupStatusBadge.textContent = `已挂断 · 通话时长 ${durationStr}`;
      hangupTimestamp.textContent = `挂断时间 ${endTimeStr}`;
      hangupInfoEl.classList.add('visible');

      hangupCircle.classList.add('is-ended');
      hangupLabel.textContent = '已挂断(点此重连)';
      waveformBars.classList.add('paused');
      resetWaveBarsToStatic();
    }

    // 11根饱满梭形声波高度分布（还原图2中部菱形高对比声波）
    const baseEnvelope = [7, 14, 24, 34, 44, 52, 44, 34, 24, 14, 7];

    function resetWaveBarsToStatic() {
      waveBarElements.forEach((bar, i) => {
        bar.style.height = `${Math.max(5, Math.round(baseEnvelope[i] * 0.35))}px`;
      });
    }

    function animateWaveform() {
      if (waveInterval) clearInterval(waveInterval);
      waveInterval = setInterval(() => {
        if (isCallEnded || isMuted) {
          resetWaveBarsToStatic();
          return;
        }
        waveBarElements.forEach((bar, i) => {
          const base = baseEnvelope[i];
          if (i === 0 || i === waveBarElements.length - 1) {
            bar.style.height = `${5 + Math.floor(Math.random() * 4)}px`;
          } else {
            const factor = 0.55 + Math.random() * 0.65;
            const h = Math.max(7, Math.min(54, Math.round(base * factor)));
            bar.style.height = `${h}px`;
          }
        });
      }, 140);
    }

    function handleAvatarFile(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const dataUrl = e.target.result;
        avatarImage.src = dataUrl;
        try {
          localStorage.setItem('laya_voice_avatar', dataUrl);
        } catch (err) {}
      };
      reader.readAsDataURL(file);
    }

    avatarTrigger.addEventListener('click', () => avatarFileInput.click());
    sheetUploadAvatarBtn.addEventListener('click', () => avatarFileInput.click());

    avatarFileInput.addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if (file) handleAvatarFile(file);
      avatarFileInput.value = '';
    });

    function updateNickname(val) {
      const trimmed = val.trim();
      nicknameInput.value = trimmed;
      if (trimmed) {
        nicknameDisplay.textContent = trimmed;
        nicknameDisplay.classList.remove('hidden');
      } else {
        nicknameDisplay.textContent = '';
        nicknameDisplay.classList.add('hidden');
      }
      try {
        localStorage.setItem('laya_voice_nickname', trimmed);
      } catch (e) {}
    }

    nicknameTrigger.addEventListener('click', () => {
      const current = localStorage.getItem('laya_voice_nickname') ?? '他超爱了';
      const next = prompt('请输入要显示的昵称（留空可隐藏昵称）：', current);
      if (next !== null) updateNickname(next);
    });

    nicknameInput.addEventListener('input', (e) => updateNickname(e.target.value));

    brandTitleInput.addEventListener('input', (e) => {
      const val = e.target.value || 'Laya-语音匹配';
      brandTitleText.textContent = val;
      document.title = val;
      try {
        localStorage.setItem('laya_voice_title', val);
      } catch (err) {}
    });

    // 左侧 + 添加好友/关注点击交互
    addFriendBtn.addEventListener('click', () => {
      isFollowed = !isFollowed;
      addFriendBtn.classList.toggle('followed', isFollowed);
      addFriendIcon.textContent = isFollowed ? '✓' : '+';
      addFriendLabel.textContent = isFollowed ? '已发送申请' : '添加好友/关注';
    });

    hangupBtn.addEventListener('click', () => {
      if (!isCallEnded) {
        triggerHangup();
      } else {
        startCallTimer();
      }
    });

    muteBtn.addEventListener('click', () => {
      isMuted = !isMuted;
      muteCircle.classList.toggle('active-toggle', isMuted);
      muteLabel.textContent = isMuted ? '已静音' : '静音';
      waveformBars.classList.toggle('paused', isMuted || isCallEnded);
    });

    speakerBtn.addEventListener('click', () => {
      isSpeakerOn = !isSpeakerOn;
      speakerCircle.classList.toggle('active-toggle', isSpeakerOn);
      speakerLabel.textContent = isSpeakerOn ? '已免提' : '免提';
    });

    // 样式切换：图2单挂断键 vs 图1三键
    styleSingleBtn.addEventListener('click', () => {
      actionButtonsRow.classList.add('single-mode');
      styleSingleBtn.classList.add('active-opt');
      styleTripleBtn.classList.remove('active-opt');
    });

    styleTripleBtn.addEventListener('click', () => {
      actionButtonsRow.classList.remove('single-mode');
      styleTripleBtn.classList.add('active-opt');
      styleSingleBtn.classList.remove('active-opt');
    });

    toggleAddFriendVisBtn.addEventListener('click', () => {
      const hidden = addFriendBtn.classList.toggle('hidden');
      toggleAddFriendVisBtn.classList.toggle('active-opt', !hidden);
      toggleAddFriendVisBtn.textContent = hidden ? '已隐藏「+ 添加好友/关注」' : '显示「+ 添加好友/关注」';
    });

    toggleDockLeftVisBtn.addEventListener('click', () => {
      const hidden = dockLeftIcons.classList.toggle('hidden');
      toggleDockLeftVisBtn.classList.toggle('active-opt', !hidden);
      toggleDockLeftVisBtn.textContent = hidden ? '已隐藏底部左侧图标' : '显示底部左侧「+ / 话筒」';
    });

    function openSettings() {
      customSecondsInput.value = elapsedSeconds;
      settingsModal.classList.add('open');
    }

    function closeSettings() {
      settingsModal.classList.remove('open');
    }

    topHeader.addEventListener('click', openSettings);
    topRightSettingBtn.addEventListener('click', openSettings);
    timerTrigger.addEventListener('click', openSettings);
    closeSettingsBtn.addEventListener('click', closeSettings);
    settingsModal.addEventListener('click', (e) => {
      if (e.target === settingsModal) closeSettings();
    });

    applyTimerBtn.addEventListener('click', () => {
      const sec = parseInt(customSecondsInput.value, 10);
      elapsedSeconds = isNaN(sec) || sec < 0 ? 0 : sec;
      startCallTimer();
      closeSettings();
    });

    resetZeroBtn.addEventListener('click', () => {
      elapsedSeconds = 0;
      customSecondsInput.value = 0;
      startCallTimer();
      closeSettings();
    });

    function initApp() {
      const savedAvatar = localStorage.getItem('laya_voice_avatar');
      avatarImage.src = savedAvatar || DEFAULT_AVATAR;

      const savedNickname = localStorage.getItem('laya_voice_nickname');
      if (savedNickname === null) {
        updateNickname('他超爱了');
      } else {
        updateNickname(savedNickname);
      }

      const savedTitle = localStorage.getItem('laya_voice_title');
      if (savedTitle) {
        brandTitleText.textContent = savedTitle;
        brandTitleInput.value = savedTitle;
      }

      startCallTimer();
      animateWaveform();
    }

    initApp();
  </script>
</body>
</html>
